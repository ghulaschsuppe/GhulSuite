# Testplan 2 / 7: switch on the app PIN, lock, unlock with the PIN.
appId: de.danerd.ghulsuite.dev
name: App PIN, lock and unlock
---
- launchApp:
    stopApp: false
- tapOn: "Options"
- tapOn: "Unlocking"
- tapOn: "App PIN"
# In the sheet: the field right above "Repeat app PIN" (the sheet title is also "App PIN").
- tapOn:
    text: "App PIN"
    above: "Repeat app PIN"
- inputText: "246813"
- tapOn: "Repeat app PIN"
- inputText: "246813"
- hideKeyboard
- tapOn: "Save"
- takeScreenshot: 04-pin-on
# Header button (screen reader label), works with and without a keyboard on screen.
- tapOn: "Lock now"
- extendedWaitUntil:
    visible: "Unlock with app PIN"
    timeout: 15000
- takeScreenshot: 04-locked
- tapOn: "App PIN"
- inputText: "246813"
- hideKeyboard
- tapOn: "Unlock with app PIN"
- extendedWaitUntil:
    visible: "Options"
    timeout: 30000
- takeScreenshot: 04-unlocked
