# Testplan 2 / 7: switch on the app PIN, lock, unlock with the PIN.
appId: de.danerd.ghulsuite.dev
name: App PIN, lock and unlock
---
- launchApp:
    stopApp: false
- tapOn: { id: "tab-settings" }
# The tab keeps its place from before (on purpose): start at the top ("Lock now" stays above
# any banner, e.g. the one about unsaved entries, also in landscape).
- scrollUntilVisible:
    element: "Lock now|Jetzt sperren"
    direction: UP
- scrollUntilVisible:
    element: "Unlocking|Entsperren"
    direction: DOWN
- tapOn: "Unlocking"
- tapOn: "App PIN"
# In the sheet: the field right above "Repeat app PIN" (the sheet title is also "App PIN").
# In the sheet the title and the field are both "App PIN": index 1 is the field.
- tapOn:
    text: "App PIN"
    index: 1
- inputText: "246813"
- tapOn: "Repeat app PIN"
- inputText: "246813"
# Switching on the app PIN needs both factors (H6: who finds the app unlocked cannot): the
# master password and the key file of the setup.
- tapOn: "Master password"
- inputText: "Ghul-Test-Passwort-2026!"
- hideKeyboard
- scrollUntilVisible:
    element: "Key file"
    direction: DOWN
- tapOn: "Key file"
- scrollUntilVisible:
    element: "Choose key file"
    direction: DOWN
- tapOn: "Choose key file"
- extendedWaitUntil:
    visible: "ghulsuite.*\\.ghlkey"
    timeout: 30000
- tapOn: "ghulsuite.*\\.ghlkey"
- extendedWaitUntil:
    visible: "Key file: .*"
    timeout: 15000
- takeScreenshot: 04-pin-proof
- scrollUntilVisible:
    element: "Save"
    direction: DOWN
- tapOn: "Save"
- takeScreenshot: 04-pin-on
# Header button (screen reader label), works with and without a keyboard on screen.
- tapOn: "Lock now"
- extendedWaitUntil:
    visible: "Unlock with app PIN"
    timeout: 15000
- takeScreenshot: 04-locked
- tapOn: "App PIN"
- inputText: "246813"
- hideKeyboard
- tapOn: "Unlock with app PIN"
- extendedWaitUntil:
    visible: "Options"
    timeout: 30000
- takeScreenshot: 04-unlocked
