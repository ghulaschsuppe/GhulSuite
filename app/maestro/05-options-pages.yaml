# Testplan 11 / 16: every page under Options opens.
appId: de.danerd.ghulsuite.dev
name: Options pages
---
- launchApp:
    stopApp: false
- tapOn: { id: "tab-settings" }
# The tab keeps its place from before (on purpose): start at the top ("Lock now" stays above
# any banner, e.g. the one about unsaved entries, also in landscape).
- scrollUntilVisible:
    element: "Lock now|Jetzt sperren"
    direction: UP
- scrollUntilVisible:
    element: "Unlocking|Entsperren"
    direction: DOWN
- runFlow:
    file: open-option.yaml
    env: { PAGE: "Unlocking", SHOT: "05-unlocking" }
- runFlow:
    file: open-option.yaml
    env: { PAGE: "Privacy", SHOT: "05-privacy" }
- runFlow:
    file: open-option.yaml
    env: { PAGE: "About and help", SHOT: "05-about" }
