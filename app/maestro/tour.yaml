# Helper: every area once, photographed (${PREFIX}-<area>), no technical error text anywhere.
appId: de.danerd.ghulsuite.dev
---
- tapOn: { id: "tab-pass" }
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${PREFIX}-pass
- assertNotVisible: ".*[Cc]oroutine.*"
- tapOn: { id: "tab-auth" }
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${PREFIX}-auth
- tapOn: { id: "tab-cal" }
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${PREFIX}-cal
- tapOn: { id: "tab-settings" }
# The tab keeps its place from before (on purpose): start at the top ("Lock now" stays above
# any banner, e.g. the one about unsaved entries, also in landscape).
- scrollUntilVisible:
    element: "Lock now|Jetzt sperren"
    direction: UP
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${PREFIX}-options
- assertNotVisible: ".*[Cc]oroutine.*"
