# Killed by Android, part 2: back into the app. It asks to unlock (the keys were only in memory)
# and then shows GhulDrive correctly at once: server named, no "Not set up", no "…".
appId: de.danerd.ghulsuite.dev
name: Vom System beendet 2
---
- launchApp:
    stopApp: false
- extendedWaitUntil: { visible: "Unlock with app PIN", timeout: 30000 }
- takeScreenshot: x2-02-locked
- tapOn: "App PIN"
- inputText: "246813"
- hideKeyboard
- tapOn: "Unlock with app PIN"
- extendedWaitUntil: { visible: "Lock now", timeout: 30000 }
- tapOn: { id: "tab-drive" }
- extendedWaitUntil: { visible: "Urlaub-Maestro", timeout: 60000 }
- assertVisible: ${GHUL_SERVER}
- assertNotVisible: "Not set up"
- assertNotVisible: "No server yet"
- assertNotVisible: "GHUL-DEV-ALARM.*"
- takeScreenshot: x2-03-after
