# Servers back, part 3: GhulDrive lists its folders again with one tap and no error is left over.
# Since F91 the known folders stay listed while offline and "Try again" hides the message at
# once, so it waits until the folder shows and the message is gone.
appId: de.danerd.ghulsuite.dev
name: Server weg 3
---
- tapOn: { id: "tab-drive" }
- tapOn:
    text: "Try again|Retry|Refresh"
    optional: true
- extendedWaitUntil: { visible: "Urlaub-Maestro", timeout: 180000 }
- extendedWaitUntil: { notVisible: "No connection to the server.*", timeout: 180000 }
- assertNotVisible: "GHUL-DEV-ALARM.*"
- takeScreenshot: x1-06-drive-back
