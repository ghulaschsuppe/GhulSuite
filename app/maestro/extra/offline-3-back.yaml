# Servers back, part 3: synchronising works again with one tap, then GhulDrive lists its
# folders and no error is left over.
appId: de.danerd.ghulsuite.dev
name: Server weg 3
---
- tapOn: { id: "tab-settings" }
# The tab keeps its place from before (on purpose): start at the top.
- scrollUntilVisible:
    element: "Unlocking|Entsperren"
    direction: UP
- scrollUntilVisible: { element: "Servers, sync & sharing", direction: DOWN }
- tapOn: "Servers, sync & sharing"
# Right after unlocking the automatic synchronisation may still run on the slow server; the page
# says "Loading …" until it is done.
- scrollUntilVisible: { element: "Synchronise now", direction: DOWN, timeout: 180000 }
- tapOn: "Synchronise now"
- extendedWaitUntil:
    visible: "Synchronised: .*"
    timeout: 180000
- assertNotVisible: "Synchronisation failed: .*"
- assertNotVisible: "GHUL-DEV-ALARM.*"
- takeScreenshot: x1-05-sync-back
- back
# Synchronising went through, so the server answers again. Only now GhulDrive: since F91 the
# known folders stay listed while offline and "Try again" hides the message at once, so the
# check is only meaningful once the server is known to be back.
- tapOn: { id: "tab-drive" }
- tapOn:
    text: "Try again|Retry|Refresh"
    optional: true
- extendedWaitUntil: { visible: "Urlaub-Maestro", timeout: 180000 }
- extendedWaitUntil: { notVisible: "No connection to the server.*", timeout: 180000 }
- assertNotVisible: "GHUL-DEV-ALARM.*"
- takeScreenshot: x1-06-drive-back
