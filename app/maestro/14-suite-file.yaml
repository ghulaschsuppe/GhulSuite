# Konzept 4/5: the suite as a file (.ghlzip). Saved under Options, Suite file (system dialog),
# then that very file opened again: checked completely with password and key file, then it
# replaces the state on this device (the same state: no question). The suite holds the
# documents of GhulDocs (07-docs.yaml): they travel in the file and are there after opening it.
# Every step with a screenshot.
appId: de.danerd.ghulsuite.dev
name: Suite file
---
- runFlow: home.yaml
- tapOn: { id: "tab-settings" }
# The tab keeps its place from before (on purpose): start at the top.
- scrollUntilVisible:
    element: "Unlocking"
    direction: UP
- scrollUntilVisible:
    element: "Open and save \\(\\.ghlzip\\)|Unsaved changes"
    direction: DOWN
- tapOn: "Suite file"
- extendedWaitUntil:
    visible: "Not saved as a file yet\\.|Suite file: .*"
    timeout: 10000
- takeScreenshot: 14-01-file-page
- assertNotVisible: ".*[Cc]oroutine.*"

# --- Save as a file ----------------------------------------------------------------------------
- scrollUntilVisible:
    element: "Save as …"
    direction: DOWN
- tapOn: "Save as …"
# System dialog "Save to" (DocumentsUI), as for the key file during the setup.
- tapOn:
    text: "(?i)save"
    retryTapIfNoChange: false
# The save dialog shows how far it is, then where it was saved.
- extendedWaitUntil:
    visible: "Saved in .*"
    timeout: 60000
- takeScreenshot: 14-02a-save-dialog
- tapOn: { id: "save-done" }
- scrollUntilVisible:
    element: "Everything is saved in the suite file\\."
    direction: UP
- assertNotVisible: "Unsaved changes.*"
- takeScreenshot: 14-02-saved

# --- Open that file again ----------------------------------------------------------------------
- scrollUntilVisible:
    element: "Open another suite file"
    direction: DOWN
- tapOn: "Open another suite file"
# DocumentsUI lists the file just saved among the recent ones.
- extendedWaitUntil:
    visible: "GhulSuite.*\\.ghlzip"
    timeout: 30000
- tapOn: "GhulSuite.*\\.ghlzip"
- extendedWaitUntil:
    visible: "Open suite file"
    timeout: 30000
- takeScreenshot: 14-03-open-form
- tapOn:
    text: "Master password"
    index: 0
- inputText: "Ghul-Test-Passwort-2026!"
- hideKeyboard
- tapOn: "Choose key file"
- extendedWaitUntil:
    visible: "ghulsuite.*\\.ghlkey"
    timeout: 30000
- tapOn: "ghulsuite.*\\.ghlkey"
- extendedWaitUntil:
    visible: "Key file: .*"
    timeout: 15000
- tapOn:
    text: "Open"
    index: 0
# The file is the state of this device: no question, it is taken at once.
- extendedWaitUntil:
    visible: "GhulSuite.*\\.ghlzip opened\\.|Open this file\\?"
    timeout: 120000
- runFlow:
    when:
      visible: "Open this file\\?"
    commands:
      - takeScreenshot: 14-04-question
      - tapOn:
          text: "Open"
          index: 1
# Opened: the app starts again at its main view, everything is there.
- extendedWaitUntil:
    visible: "Search entries"
    timeout: 60000
- assertNotVisible: ".*[Cc]oroutine.*"
- assertNotVisible: ".*[Ee]xception.*"
- takeScreenshot: 14-05-opened
# The documents of GhulDocs came with the file: the folder and the file in it are there.
- tapOn: { id: "tab-docs" }
- extendedWaitUntil:
    visible: "Steuer"
    timeout: 30000
- tapOn: "Steuer"
- extendedWaitUntil:
    visible: "ghuldocs-probe\\.txt|ghulsuite.*\\.ghlkey"
    timeout: 30000
- takeScreenshot: 14-05b-docs-after-open
- tapOn: "ghuldocs-probe\\.txt|ghulsuite.*\\.ghlkey"
- extendedWaitUntil:
    visible: "GhulDocs probe.*|The app cannot show this type of file\\."
    timeout: 30000
- back
- back
# The opened file is the suite file from now on (saving goes there).
- tapOn: { id: "tab-settings" }
- scrollUntilVisible:
    element: "Unlocking"
    direction: UP
- scrollUntilVisible:
    element: "Open and save \\(\\.ghlzip\\)|Unsaved changes"
    direction: DOWN
- tapOn: "Suite file"
- extendedWaitUntil:
    visible: "Suite file: GhulSuite.*"
    timeout: 10000
- assertVisible: "Everything is saved in the suite file\\."
- takeScreenshot: 14-06-file-after-open

# Opening a suite file removes this device's quick unlock (on purpose: it belonged to the state
# replaced). The flows after this one unlock with the app PIN: switch it on again.
- runFlow: home.yaml
- tapOn: { id: "tab-settings" }
- scrollUntilVisible:
    element: "Unlocking"
    direction: UP
- tapOn: "Unlocking"
- tapOn: "App PIN"
- tapOn:
    text: "App PIN"
    index: 1
- inputText: "246813"
- tapOn: "Repeat app PIN"
- inputText: "246813"
- hideKeyboard
- tapOn: "Save"
- takeScreenshot: 14-07-pin-again
