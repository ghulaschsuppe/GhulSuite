# GhulDocs (UMBAU-GHULDOCS 5.4): a folder, a file added from the device (the system picker; the
# key file saved during the setup is among its recent files), the viewer, favourite, moving into
# the folder, the trash with its question and "Restore", the check on the options page. Every
# step with a screenshot.
appId: de.danerd.ghulsuite.dev
name: GhulDocs
---
- runFlow: home.yaml
- tapOn: { id: "tab-docs" }
- extendedWaitUntil:
    visible: "Search documents"
    timeout: 15000
- extendedWaitUntil:
    visible: ".* of 1 GB"
    timeout: 15000
- takeScreenshot: 07-01-empty
- assertNotVisible: ".*[Cc]oroutine.*"

# --- A folder -----------------------------------------------------------------------------------
- tapOn: "Add"
- extendedWaitUntil:
    visible: "Add to GhulDocs"
    timeout: 10000
- takeScreenshot: 07-02-add-sheet
- tapOn: "New folder"
- extendedWaitUntil:
    visible: "Name"
    timeout: 10000
- inputText: "Steuer"
- hideKeyboard
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Steuer"
    timeout: 15000

# --- A file from the device (DocumentsUI) -------------------------------------------------------
- tapOn: "Add"
- tapOn: "Add files"
- extendedWaitUntil:
    visible: "ghulsuite.*\\.ghlkey|ghuldocs-probe\\.txt"
    timeout: 30000
- takeScreenshot: 07-03-picker
- runFlow:
    when:
      visible: "ghuldocs-probe\\.txt"
    commands:
      - tapOn: "ghuldocs-probe\\.txt"
- runFlow:
    when:
      notVisible: "Search documents"
    commands:
      - tapOn: "ghulsuite.*\\.ghlkey"
- takeScreenshot: 07-04a-after-picker
# Added: the file is in the list (the message "… added." may be gone again by then).
- extendedWaitUntil:
    visible: "ghuldocs-probe\\.txt|ghulsuite.*\\.ghlkey"
    timeout: 60000
- extendedWaitUntil:
    visible: "Search documents"
    timeout: 30000
- takeScreenshot: 07-04-added
- assertNotVisible: "0 B of 1 GB"

# --- View it ------------------------------------------------------------------------------------
- tapOn: "ghuldocs-probe\\.txt|ghulsuite.*\\.ghlkey"
- extendedWaitUntil:
    visible: "GhulDocs probe.*|The app cannot show this type of file\\."
    timeout: 30000
- takeScreenshot: 07-05-viewer
- back

# --- Favourite, move into the folder ------------------------------------------------------------
- longPressOn: "ghuldocs-probe\\.txt|ghulsuite.*\\.ghlkey"
- extendedWaitUntil:
    visible: "1 selected"
    timeout: 10000
- takeScreenshot: 07-06-selected
- tapOn: "Add to favourites"
- longPressOn: "ghuldocs-probe\\.txt|ghulsuite.*\\.ghlkey"
- tapOn: "More"
- tapOn: "Move"
- extendedWaitUntil:
    visible: "Move here"
    timeout: 10000
- tapOn: { id: "docs-folder-Steuer" }
- extendedWaitUntil:
    visible: ".* › Steuer"
    timeout: 10000
- takeScreenshot: 07-07-move
- tapOn: { id: "docs-pick-here" }
- extendedWaitUntil:
    notVisible: "ghuldocs-probe\\.txt|ghulsuite.*\\.ghlkey"
    timeout: 15000
- tapOn: "Steuer"
- extendedWaitUntil:
    visible: "ghuldocs-probe\\.txt|ghulsuite.*\\.ghlkey"
    timeout: 15000
- takeScreenshot: 07-08-in-folder

# --- The trash: it asks first, "Undo", then restore -------------------------------------------
- longPressOn: "ghuldocs-probe\\.txt|ghulsuite.*\\.ghlkey"
- tapOn: "Move to trash"
- extendedWaitUntil:
    visible: "Move to the trash\\?"
    timeout: 10000
- takeScreenshot: 07-09-trash-ask
- tapOn: { id: "ask-confirm" }
- extendedWaitUntil:
    visible: "Undo"
    timeout: 10000
- extendedWaitUntil:
    notVisible: "Undo"
    timeout: 20000
- back
- extendedWaitUntil:
    visible: { id: "docs-view-trash" }
    timeout: 10000
- tapOn: { id: "docs-view-trash" }
- extendedWaitUntil:
    visible: "ghuldocs-probe\\.txt|ghulsuite.*\\.ghlkey"
    timeout: 15000
- takeScreenshot: 07-10-trash
- longPressOn: "ghuldocs-probe\\.txt|ghulsuite.*\\.ghlkey"
- tapOn: "Restore"
- extendedWaitUntil:
    visible: ".* restored"
    timeout: 15000
- tapOn: { id: "docs-crumb-0" }
- tapOn: "Steuer"
- extendedWaitUntil:
    visible: "ghuldocs-probe\\.txt|ghulsuite.*\\.ghlkey"
    timeout: 15000
- back
- assertNotVisible: ".*[Ee]xception.*"

# --- Options, GhulDocs: usage and the check -----------------------------------------------------
- tapOn: { id: "tab-settings" }
- scrollUntilVisible:
    element: "Storage used, check, trash"
    direction: DOWN
- tapOn: "Storage used, check, trash"
# One GhulDocs vault: its own limit.
- extendedWaitUntil:
    visible: ".* of 1 GB"
    timeout: 15000
- scrollUntilVisible:
    element: "Check"
    direction: DOWN
- tapOn: "Check"
- extendedWaitUntil:
    visible: "All documents are intact\\."
    timeout: 30000
- takeScreenshot: 07-11-options
- back

# --- A second GhulDocs vault: like every other area (each up to 1 GB, all of them up to 3 GB) ----
- tapOn: { id: "tab-settings" }
- scrollUntilVisible:
    element: "Vaults"
    direction: DOWN
- tapOn: "Vaults"
- extendedWaitUntil:
    visible: ".*for someone else.*"
    timeout: 15000
- takeScreenshot: 07-12-vaults-hint
- scrollUntilVisible:
    element: "New vault"
    direction: DOWN
- tapOn: "New vault"
- tapOn: "GhulDocs"
- tapOn: "Vault name"
- inputText: "Steuer 2025"
- hideKeyboard
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Steuer 2025"
    timeout: 15000
- takeScreenshot: 07-13-second-docs-vault
# Its menu says what "Export" and "Share as separate vault" are for.
- tapOn: { id: "vault-menu-Steuer 2025" }
- extendedWaitUntil:
    visible: "Share as separate vault"
    timeout: 10000
- assertVisible: "For you, encrypted.*"
- assertVisible: "For someone else: .*"
- takeScreenshot: 07-14-vault-menu
- tapOn: "Share as separate vault"
- extendedWaitUntil:
    visible: "The whole GhulDocs vault .*"
    timeout: 10000
- takeScreenshot: 07-15-hand-on
- tapOn: "Cancel"
- back
# GhulDocs lists both vaults ("All vaults"), each opens on its own.
- tapOn: { id: "tab-docs" }
- extendedWaitUntil:
    visible: "Steuer 2025"
    timeout: 15000
- extendedWaitUntil:
    visible: ".* of 3 GB"
    timeout: 15000
- takeScreenshot: 07-16-all-vaults
- tapOn: "Steuer 2025"
- extendedWaitUntil:
    visible: ".* of 1 GB"
    timeout: 15000
- takeScreenshot: 07-17-second-vault
- assertNotVisible: ".*[Ee]xception.*"

# --- Tidy up: the second vault goes again (deleting asks for its name), so later flows find one ---
- tapOn: { id: "tab-settings" }
- scrollUntilVisible:
    element: "Vaults"
    direction: DOWN
- tapOn: "Vaults"
- scrollUntilVisible:
    element: { id: "vault-menu-Steuer 2025" }
    direction: DOWN
- tapOn: { id: "vault-menu-Steuer 2025" }
- extendedWaitUntil:
    visible: "Share as separate vault"
    timeout: 10000
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Delete .Steuer 2025.\\?"
    timeout: 10000
- tapOn: "Type .Steuer 2025. to confirm"
- inputText: "Steuer 2025"
- hideKeyboard
- takeScreenshot: 07-18-delete-vault
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: "Steuer 2025"
    timeout: 15000
- back
- tapOn: { id: "tab-docs" }
- extendedWaitUntil:
    visible: "Steuer"
    timeout: 15000
- assertNotVisible: ".*[Ee]xception.*"
