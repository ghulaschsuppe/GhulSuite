# Testplan 1: new suite with master password and key file, recovery code confirmed.
appId: de.danerd.ghulsuite.dev
name: Setup
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# A dialog of the (still busy) system could cover the app on a fresh emulator.
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Set up new"
    timeout: 30000
- takeScreenshot: 01-start
- tapOn: "Set up new"
# Step 1 of 8: master password. Index 0 is the step title, index 1 the field label.
- tapOn:
    text: "Master password"
    index: 1
- inputText: "Ghul-Test-Passwort-2026!"
- tapOn: "Repeat password"
- inputText: "Ghul-Test-Passwort-2026!"
- hideKeyboard
- takeScreenshot: 01-password
- tapOn: "Next"
# Step 2: second factor: key file.
- tapOn: "Key file"
- tapOn: "Create and save key file"
# System dialog "Save to" (DocumentsUI)
- tapOn:
    text: "(?i)save"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Key file ready."
    timeout: 15000
- tapOn: "Next"
# Step 3: storage (app storage). "Set up" is enabled once the key derivation is calibrated.
- extendedWaitUntil:
    visible:
      text: "Set up"
      enabled: true
    timeout: 90000
- takeScreenshot: 01-storage
- tapOn: "Set up"
# Step 4: synchronisation later (the button says "Later" too; it is the last match).
- extendedWaitUntil:
    visible: "Step 4 of 8.*"
    timeout: 90000
- tapOn:
    text: "Later"
    index: 1
# Step 5: areas (GhulPass, GhulAuth, GhulCal are on by default).
- takeScreenshot: 01-areas
- scrollUntilVisible:
    element: "Next"
    direction: DOWN
- tapOn: "Next"
# Step 6: locking, step 7: unlocking (no fingerprint on the emulator).
- tapOn: "Next"
- scrollUntilVisible:
    element: "Next"
    direction: DOWN
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Your recovery code"
    timeout: 90000
- takeScreenshot: 01-recovery-code
- copyTextFrom:
    text: "[A-Z0-9]{5}\\s+[A-Z0-9]{5}\\s+[A-Z0-9]{5}"
    index: 0
- evalScript: ${output.group3 = maestro.copiedText.trim().split(/\s+/)[2]}
- tapOn: "I have written down or printed the code"
- tapOn: "Next"
- tapOn: "Group 3 of the code"
- inputText: ${output.group3}
- hideKeyboard
- tapOn: "Finish"
- extendedWaitUntil:
    visible: "Search entries"
    timeout: 30000
- takeScreenshot: 01-done
