# Testplan 1: new suite with master password and key file, recovery code confirmed.
appId: de.danerd.ghulsuite.dev
name: Setup
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# A dialog of the (still busy) system could cover the app on a fresh emulator.
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Set up new"
    timeout: 30000
- takeScreenshot: 01-start
- tapOn: "Set up new"
# Step 1 of 8: master password. Index 0 is the step title, index 1 the field label.
- tapOn:
    text: "Master password"
    index: 1
- inputText: "Ghul-Test-Passwort-2026!"
- tapOn: "Repeat password"
- inputText: "Ghul-Test-Passwort-2026!"
- hideKeyboard
- takeScreenshot: 01-password
- tapOn: "Next"
# Step 2: second factor: key file. Both choices stand at the top; the key file by its text
# (below them, a chosen key shows its backup chips, one of them "Key file").
- tapOn: "A small file you keep safe"
- scrollUntilVisible:
    element: "Create and save key file"
    direction: DOWN
- tapOn: "Create and save key file"
# System dialog "Save to" (DocumentsUI)
- tapOn:
    text: "(?i)save"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Key file ready."
    timeout: 15000
- scrollUntilVisible:
    element: "Next"
    direction: DOWN
- tapOn: "Next"
# Step 3: create (kept on this device). "Set up" is enabled once the key derivation is calibrated.
- extendedWaitUntil:
    visible:
      text: "Set up"
      enabled: true
    timeout: 90000
- takeScreenshot: 01-storage
- tapOn: "Set up"
# Step 4: areas (GhulPass, GhulAuth, GhulCal are on by default).
- extendedWaitUntil:
    visible: "Step 4 of 8.*"
    timeout: 90000
- takeScreenshot: 01-areas
- scrollUntilVisible:
    element: "Next"
    direction: DOWN
- tapOn: "Next"
# Step 5: locking, step 6: unlocking (no fingerprint on the emulator).
- extendedWaitUntil:
    visible: "Step 5 of 8.*"
    timeout: 30000
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Step 6 of 8.*"
    timeout: 30000
- scrollUntilVisible:
    element: "Next"
    direction: DOWN
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Your recovery code"
    timeout: 90000
- takeScreenshot: 01-recovery-code
# r9: the whole code is typed back (rows of three groups, the last row has two).
- copyTextFrom:
    text: "[A-Z0-9]{5}\\s+[A-Z0-9]{5}\\s+[A-Z0-9]{5}"
    index: 0
- evalScript: ${output.code = maestro.copiedText.trim()}
- copyTextFrom:
    text: "[A-Z0-9]{5}\\s+[A-Z0-9]{5}\\s+[A-Z0-9]{5}"
    index: 1
- evalScript: ${output.code = output.code + " " + maestro.copiedText.trim()}
- copyTextFrom:
    text: "[A-Z0-9]{5}\\s+[A-Z0-9]{5}\\s+[A-Z0-9]{5}"
    index: 2
- evalScript: ${output.code = output.code + " " + maestro.copiedText.trim()}
- copyTextFrom:
    text: "[A-Z0-9]{5}\\s+[A-Z0-9]{5}"
    index: 0
- evalScript: ${output.code = output.code + " " + maestro.copiedText.trim()}
- tapOn: "I have written down or printed the code"
- tapOn: "Next"
- tapOn: { id: "code-confirm" }
- inputText: ${output.code}
- hideKeyboard
- tapOn: "Finish"
# Step 8: the suite file, at a place chosen in the system dialog "Save to" (DocumentsUI).
- extendedWaitUntil:
    visible: "Step 8 of 8.*"
    timeout: 30000
- takeScreenshot: 01-suite-file
- tapOn: { id: "wz-file" }
- tapOn:
    text: "(?i)save"
    retryTapIfNoChange: false
# M1: a place where later saves would write over the file (Download in the emulator): the wizard
# says so and offers "Choose a safe place" (its folder picker is not driven here); "Later" goes on.
# Waited for: the app (done) or the "Later" button of that step.
- extendedWaitUntil:
    visible: "Search entries|Later"
    timeout: 30000
- runFlow:
    when:
      visible: { id: "wz-share-later" }
    commands:
      - takeScreenshot: 01-share-folder
      - tapOn: { id: "wz-share-later" }
- extendedWaitUntil:
    visible: "Search entries"
    timeout: 30000
- takeScreenshot: 01-done
