# Testplan D1 to D4: GhulDrive on an SFTP server with user name and password (the test server of
# the runner; tools/run-maestro.sh passes the address the device reaches it at as GHUL_SERVER),
# then a folder. tools/check-server-flows.sh looks at the server afterwards: the folder name must
# not be readable there.
appId: de.danerd.ghulsuite.dev
name: GhulDrive on a real server
---
- runFlow: unlock.yaml
- tapOn: { id: "tab-settings" }
# The tab keeps its place from before (on purpose): start at the top.
- scrollUntilVisible:
    element: "Unlocking|Entsperren"
    direction: UP
- scrollUntilVisible:
    element: "Manage areas"
    direction: DOWN
- tapOn: "Manage areas"
- tapOn: "GhulDrive"
- extendedWaitUntil:
    visible: "Set up GhulDrive"
    timeout: 10000
- tapOn: "Set up"
- extendedWaitUntil:
    visible: "Own server for GhulDrive"
    timeout: 10000
- tapOn: "Server address"
- inputText: ${GHUL_SERVER}
# Tap the port's own value ("22"), not its label: the label sits next to the address field.
- tapOn: "22"
- eraseText
- inputText: "2223"
- tapOn: "User name"
- inputText: "ghulsftp"
- hideKeyboard
# The values really are in their fields (the log shows the fields if not).
- assertVisible: ${GHUL_SERVER}
- assertVisible: "2223"
# The chip "Password" (the field below is called "Server password").
- tapOn: "Password"
- scrollUntilVisible:
    element: "Server password"
    direction: DOWN
- tapOn: "Server password"
- inputText: "test-pw-123"
- hideKeyboard
- takeScreenshot: s1-drive-server
# Step 1: test the login. Before that there is no folder to choose (only "3. Choose folder" in
# the checklist below the form).
- assertNotVisible: "Choose folder"
- scrollUntilVisible:
    element: "Test connection"
    direction: DOWN
- tapOn:
    text: "Test connection"
    index: 0
# First connection: the key of the server has to be confirmed.
- extendedWaitUntil:
    visible: "Check the server key"
    timeout: 60000
- takeScreenshot: s1-drive-server-key
- tapOn: "Fingerprint matches"
# Step 2: the login works, the folder list opens by itself.
- extendedWaitUntil:
    visible: "Create new \\(recommended\\)"
    timeout: 60000
- takeScreenshot: s1-drive-folders
- tapOn: "ghulsuite"
- extendedWaitUntil:
    visible: "Connection works, folder chosen\\."
    timeout: 10000
- assertVisible: "ghulsuite/"
- takeScreenshot: s1-drive-connected
# Step 3: save.
- scrollUntilVisible:
    element: "Save server"
    direction: DOWN
- tapOn: "Save server"
- extendedWaitUntil:
    visible: "GhulDrive set up"
    timeout: 120000
- takeScreenshot: s1-drive-set-up
# The new tab, from a fresh start.
- runFlow: unlock.yaml
- tapOn: { id: "tab-drive" }
- extendedWaitUntil:
    visible: "This folder is empty\\."
    timeout: 60000
- tapOn: "Add"
- extendedWaitUntil:
    visible: "Add to GhulDrive"
    timeout: 10000
- tapOn: "New folder"
# The dialog is called "New folder" too; its field is labelled "Name".
- extendedWaitUntil:
    visible: "Name"
    timeout: 10000
- tapOn: "Name"
- inputText: "Urlaub-Maestro"
- hideKeyboard
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Urlaub-Maestro"
    timeout: 60000
- takeScreenshot: s1-drive-folder
