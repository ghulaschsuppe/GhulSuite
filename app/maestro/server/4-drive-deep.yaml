# GhulDrive in depth on the slow real server (after 3-sync-share.yaml):
#   - "Create" tapped twice for a new folder: one folder, not two.
#   - Search while typing, letter by letter: no technical error, the hit appears.
#   - Into a folder and straight back out while it loads.
#   - Move to trash, "Undo": back; again to the trash, it is in the trash view.
appId: de.danerd.ghulsuite.dev
name: GhulDrive in depth on a real server
---
- runFlow: unlock.yaml
- tapOn: "GhulDrive"
- extendedWaitUntil:
    visible: "Urlaub-Maestro"
    timeout: 60000
# --- New folder, Create twice ---
- tapOn: "Add"
- extendedWaitUntil:
    visible: "Add to GhulDrive"
    timeout: 10000
- tapOn: "New folder"
- extendedWaitUntil:
    visible: "Name"
    timeout: 10000
- tapOn: "Name"
- inputText: "Steuer-2026"
- hideKeyboard
- tapOn:
    text: "Create"
    repeat: 2
    delay: 80
- extendedWaitUntil:
    visible: "Steuer-2026"
    timeout: 60000
- assertNotVisible:
    text: "Steuer-2026"
    index: 1
- takeScreenshot: s4-01-folder-once
# --- Search while typing ---
- tapOn: "Search files"
- inputText: "S"
- inputText: "t"
- inputText: "e"
- inputText: "u"
- extendedWaitUntil:
    visible: "Steuer-2026"
    timeout: 60000
- assertNotVisible: ".*[Cc]oroutine.*"
- assertNotVisible: ".*composition.*"
- hideKeyboard
- takeScreenshot: s4-02-search
- tapOn: "Steu"
- eraseText
- hideKeyboard
- extendedWaitUntil:
    visible: "Urlaub-Maestro"
    timeout: 60000
# --- In and out while loading ---
- tapOn: "Urlaub-Maestro"
- back
- tapOn: "Steuer-2026"
- back
- extendedWaitUntil:
    visible: "Urlaub-Maestro"
    timeout: 60000
- assertNotVisible: ".*[Cc]oroutine.*"
- assertNotVisible: ".*composition.*"
- takeScreenshot: s4-03-after-in-and-out
# --- Trash, undo ---
- longPressOn: "Steuer-2026"
- extendedWaitUntil:
    visible: "1 selected"
    timeout: 10000
- tapOn: "Move to trash"
- extendedWaitUntil:
    visible: "Moved to trash"
    timeout: 10000
- takeScreenshot: s4-04-trashed
- tapOn: "Undo"
- extendedWaitUntil:
    visible: "Steuer-2026"
    timeout: 60000
- takeScreenshot: s4-05-undone
- longPressOn: "Steuer-2026"
- tapOn: "Move to trash"
- extendedWaitUntil:
    notVisible: "Moved to trash"
    timeout: 30000
- tapOn: "Trash"
- extendedWaitUntil:
    visible: "Steuer-2026"
    timeout: 60000
- takeScreenshot: s4-06-trash-view
- back
