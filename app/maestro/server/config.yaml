# Flows that need the test servers of tools/test-servers.sh next to the emulator (CI). They run
# after the flows of the folder above (tools/run-maestro.sh) and continue with that suite:
# app PIN 246813, GhulMail set up without an account, GhulDrive not set up.
#   GHUL_TEST_SFTP_PASSWORD=1 sudo -E bash tools/test-servers.sh
#   maestro test app/maestro/server
# CI (tools/run-maestro.sh) runs the two flows one by one: the mail flow is not yet required.
flows:
  - "[0-9]-*.yaml"
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - GhulDrive on a real server
    - GhulMail on a real server
