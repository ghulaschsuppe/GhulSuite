# Testplan M1 to M6: a mail account on the IMAP and SMTP test servers (self-signed certificate,
# so it has to be confirmed), a mail to oneself, and reading it. tools/check-server-flows.sh
# looks at the mailbox afterwards: the mail must lie there encrypted.
appId: de.danerd.ghulsuite.dev
name: GhulMail on a real server
---
- runFlow: unlock.yaml
- tapOn: "GhulMail"
- extendedWaitUntil:
    visible: "Add e-mail account"
    timeout: 20000
- tapOn:
    text: "Add e-mail account"
    index: 0
- extendedWaitUntil:
    visible: "E-mail address"
    timeout: 10000
- tapOn: "E-mail address"
- inputText: "ghul@test.example"
- tapOn: "Password"
- inputText: "test-pw-123"
- hideKeyboard
- scrollUntilVisible:
    element: "Show server settings"
    direction: DOWN
- tapOn: "Show server settings"
# The servers were filled in from the address (imap./smtp. + domain). Tap their values, not the
# labels: "Server address" and "Port" exist twice.
- scrollUntilVisible:
    element: "imap\\.test\\.example"
    direction: DOWN
- tapOn: "imap\\.test\\.example"
- eraseText
- inputText: ${GHUL_SERVER}
- tapOn: "993"
- eraseText
- inputText: "10993"
- hideKeyboard
# The kind of connection first (it sets its usual port 587), then the test server's port.
- scrollUntilVisible:
    element: "STARTTLS"
    direction: DOWN
- tapOn: "STARTTLS"
- tapOn: "smtp\\.test\\.example"
- eraseText
- inputText: ${GHUL_SERVER}
- tapOn: "587"
- eraseText
- inputText: "10587"
- hideKeyboard
- assertVisible: "10993"
- assertVisible: "10587"
- takeScreenshot: s2-mail-servers
- scrollUntilVisible:
    element: "Check and save"
    direction: DOWN
- tapOn: "Check and save"
# Self-signed test certificate: the incoming server asks first; the outgoing server may ask
# again after the next round to the network.
- extendedWaitUntil:
    visible: "Check the certificate"
    timeout: 60000
- takeScreenshot: s2-mail-certificate
- tapOn: "Fingerprint matches"
- extendedWaitUntil:
    visible: "Check the certificate"
    timeout: 30000
    optional: true
- tapOn:
    text: "Fingerprint matches"
    optional: true
- extendedWaitUntil:
    visible: "No messages\\."
    timeout: 120000
- takeScreenshot: s2-mail-inbox-empty
# A mail to oneself: it is encrypted with the key of the own account.
- tapOn: "Write"
- extendedWaitUntil:
    visible: "Name or address"
    timeout: 10000
- tapOn: "Name or address"
- inputText: "ghul@test.example"
- tapOn: "Subject"
- inputText: "Hallo vom Emulator"
- tapOn: "Message"
- inputText: "Geheimtext-Maestro-4711"
- hideKeyboard
- takeScreenshot: s2-mail-compose
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Message sent\\."
    timeout: 120000
# It comes back into the inbox (the header button "Refresh" asks the server at once). It is
# encrypted, so the list knows neither subject nor text: only the app can open it.
- tapOn:
    text: "Refresh"
    optional: true
- extendedWaitUntil:
    visible: "Encrypted message"
    timeout: 120000
- takeScreenshot: s2-mail-inbox
- tapOn: "Encrypted message"
- extendedWaitUntil:
    visible: "Geheimtext-Maestro-4711"
    timeout: 60000
- assertVisible: "Hallo vom Emulator"
- takeScreenshot: s2-mail-read
