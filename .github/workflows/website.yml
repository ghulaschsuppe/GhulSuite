#
# The website www.ghulsuite.de (website/, built by tools/build-website.py).
#
#   main -> live site     (secrets WEBSITE_FTP_SERVER, WEBSITE_FTP_USER, WEBSITE_FTP_PASSWORD, only in the
#                          environment "website", whose deployment branch the owner limits to main)
#   (there is no preview on a server; tools/precheck.sh builds the site locally with --preview)
#
# It is built again whenever its content changes on main and after every stable release (new
# version numbers, dates and file sizes): release.yml calls this workflow then, inside the CI run
# of the push to main. A pre-release of dev does not call it. The legal notice comes from the secrets IMPRESSUM_NAME, IMPRESSUM_ADRESSE,
# IMPRESSUM_EMAIL and IMPRESSUM_HOSTER; it is never part of the repository.
name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', 'tools/build-website.py', 'docs/images/**', 'docs/TESTPROTOKOLL.md',
            '.github/workflows/website.yml', '.github/actions/ftps-upload/**']
  # After a stable release (called by release.yml): the download section shows the new version.
  workflow_call:
    secrets:
      IMPRESSUM_NAME:
        required: false
      IMPRESSUM_ADRESSE:
        required: false
      IMPRESSUM_EMAIL:
        required: false
      IMPRESSUM_HOSTER:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live-Seite (www.ghulsuite.de)
    # Called by release.yml, the github context is the one of the push to main that released.
    if: github.repository_owner == 'ghulaschsuppe' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One upload at a time (a push of the site and a release at once); the newest waiting one wins.
    concurrency:
      group: website-live
      cancel-in-progress: false
    # The credentials of the live site only exist in this environment (main only): a push to any
    # other branch cannot reach them, even with a changed copy of this workflow.
    environment: website
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Website bauen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMPRESSUM_NAME: ${{ secrets.IMPRESSUM_NAME }}
          IMPRESSUM_ADRESSE: ${{ secrets.IMPRESSUM_ADRESSE }}
          IMPRESSUM_EMAIL: ${{ secrets.IMPRESSUM_EMAIL }}
          IMPRESSUM_HOSTER: ${{ secrets.IMPRESSUM_HOSTER }}
        run: python3 tools/build-website.py --out dist/site
      - name: Hochladen nach www.ghulsuite.de
        uses: ./.github/actions/ftps-upload
        with:
          server: ${{ secrets.WEBSITE_FTP_SERVER }}
          user: ${{ secrets.WEBSITE_FTP_USER }}
          password: ${{ secrets.WEBSITE_FTP_PASSWORD }}
          local-dir: ./dist/site/
          remote-dir: ./

