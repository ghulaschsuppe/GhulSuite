# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Releases on GitHub, the source of the downloads in the README and of the updates in the app.
#
#   main -> stable release  v<VERSION>          (e.g. v0.6.0), once per version
#   dev  -> pre-release     v<VERSION>-dev.<n>  (e.g. v0.6.0-dev.3), on every push
#
# Each release carries GhulSuite.apk, GhulSuite.msi, GhulSuite-portable.zip, SHA256SUMS and
# SHA256SUMS.sig: the list of checksums signed with the app's signing key (the same key that
# signs the APK). The app checks that signature with the public key built into it, then size and
# SHA-256 of the file, before anything is installed (see core/ghul-core/src/update.rs).
# Releasing a new stable version: merge dev into main. The number is found automatically (see the
# step "v" below); VERSION only matters for a jump (1.0.0) or a fix release (0.5.1).
#
# Nothing is signed or released before the whole CI ("Android & Kern": core, Android, Windows,
# emulator) passed for exactly this commit: the last job of that run (android.yml, job "release")
# calls this workflow, only on a push to main or dev and only when every other job of the run
# passed or was skipped. A called workflow runs in the run of the caller, so the github context is
# the one of that push (event, ref, sha) and the file used is the release.yml of the pushed commit
# (a workflow_run would always take the file of the default branch). A pull request never gets
# here: its run has the event pull_request, and its changed copy of this file cannot reach the
# signing key, since the environment "release" only admits main and dev. There is no manual start.
# The jobs that use the signing key (android, publish) run in the environment "release" (its
# secrets set by the owner, deployment branches main and dev; optionally with an approval). The
# public half of the key comes from the repository variable GHUL_UPDATE_KEY (not a secret);
# publishing checks the signature against it. After a stable release (main) the live website is
# built again (website.yml, environment "website", main only); a pre-release of dev does not
# touch the live site.
name: Veröffentlichen

on:
  workflow_call:
    # Secrets come with "secrets: inherit" from android.yml (environment secrets of "release" and
    # "website" reach the called jobs only that way); declared here only for documentation.
    secrets:
      IMPRESSUM_NAME:
        required: false
      IMPRESSUM_ADRESSE:
        required: false
      IMPRESSUM_EMAIL:
        required: false
      IMPRESSUM_HOSTER:
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  # The pushed commit whose CI run calls this workflow.
  SHA: ${{ github.sha }}
  BRANCH: ${{ github.ref_name }}
  NDK_VERSION: 28.2.13676358
  CARGO_NDK_VERSION: 4.1.2
  # As in android.yml: the official gradle-wrapper.jar of Gradle 8.14.3.
  GRADLE_WRAPPER_SHA256: 7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172

jobs:
  plan:
    name: Version und Schlüssel
    # Only the original repository has the signing key; only a push to main or dev (a run for a
    # pull request never releases). The caller checks the same and that the CI passed.
    if: >-
      github.repository_owner == 'ghulaschsuppe' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      pubkey: ${{ steps.k.outputs.pubkey }}
      release: ${{ steps.gate.outputs.release }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      # Something of the app changed since the last release (a change of the documents only gives
      # no new version). That the CI passed is already known: this workflow runs in that run.
      # Only the current head of the branch is released: a re-run of an older run (its commit
      # no longer the head) would otherwise publish old code under a new, higher version.
      - id: gate
        run: |
          head=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$head" != "$SHA" ]; then
            echo "::warning::$SHA ist nicht mehr der Stand von $BRANCH (${head:-unbekannt}): keine Veröffentlichung."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags --quiet
          # main is compared with the last stable release only (a merge of dev brings the last
          # pre-release tag along, and would otherwise count as "nothing changed"); dev with the
          # last release of any kind.
          if [ "$BRANCH" = main ]; then
            last=$(git tag --merged HEAD -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          else
            last=$(git tag --merged HEAD -l 'v*' --sort=-creatordate | head -1)
          fi
          if [ -n "$last" ] && git diff --quiet "$last" HEAD -- core app VERSION rust-toolchain.toml .github/workflows/release.yml; then
            echo "Seit $last nichts an der App geändert: keine neue Version."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      # The version needs no hand work: VERSION is the wish ("0.6.0", or "1.0.0" for a jump, "0.5.1"
      # for a fix). If it is already released (or lower than the newest release), the next minor
      # version after the newest release is taken: after v0.5.0 the next one is 0.6.0, on dev as
      # 0.6.0-dev.1, 0.6.0-dev.2 and so on, until main releases it.
      - id: v
        run: |
          wish=$(tr -d ' \r\n' < VERSION)
          if ! printf '%s' "$wish" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::VERSION muss wie 0.6.0 aussehen, ist: $wish"; exit 1; fi
          git fetch --tags --quiet
          latest=$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          base=$wish
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$wish" "$latest" | sort -V | tail -1)" = "$latest" ]; then
            IFS=. read -r major minor _ <<< "$latest"
            base="$major.$((minor + 1)).0"
            echo "VERSION $wish ist schon veröffentlicht oder älter als v$latest: nächste Version $base."
          fi
          if [ "$BRANCH" = main ]; then
            version=$base; pre=false
          else
            n=$(( $(git tag -l "v$base-dev.*" | sed "s/^v$base-dev\.//" | grep -E '^[0-9]+$' | sort -n | tail -1) + 1 ))
            # The Android versionCode and the MSI version count pre-releases up to 98 only: one
            # more would get the same number as dev.98 and never install as an update.
            if [ "$n" -gt 98 ]; then echo "::error::Schon 98 Vorabversionen von $base: VERSION auf die nächste Version anheben."; exit 1; fi
            version="$base-dev.$n"; pre=true
          fi
          echo "Version: $version (Vorab: $pre)"
          { echo "version=$version"; echo "prerelease=$pre"; } >> "$GITHUB_OUTPUT"
      # The public half of the signing key: built into the app, it checks SHA256SUMS.sig. Not a
      # secret: a repository variable, so this job needs no environment (publish checks that the
      # signature made with the real key matches it).
      - id: k
        env:
          PUBKEY: ${{ vars.GHUL_UPDATE_KEY }}
        run: |
          pub=$(printf '%s' "$PUBKEY" | tr -d ' \r\n')
          if ! printf '%s' "$pub" | grep -qE '^[A-Za-z0-9+/=]{80,}$'; then echo "::error::Repository-Variable GHUL_UPDATE_KEY fehlt oder ist ungültig: keine Veröffentlichung."; exit 1; fi
          echo "pubkey=$pub" >> "$GITHUB_OUTPUT"

  android:
    name: Android (signiertes Release-APK)
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45
    # The SHA-256 of what this job built: publish checks the downloaded file against it.
    outputs:
      apk: ${{ steps.dist.outputs.apk }}
    steps:
      # Before anything is built: the three secrets of the environment "release" are there, the
      # keystore decodes and opens with password and alias, and its certificate is the key the app
      # checks updates with (GHUL_UPDATE_KEY). A clear message instead of a failure after minutes.
      - name: Signaturschlüssel prüfen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PUBKEY: ${{ needs.plan.outputs.pubkey }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n\t')" ] || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then echo "::error::Im Environment release fehlen oder sind leer:$missing"; exit 1; fi
          file="$RUNNER_TEMP/check.jks"
          trap 'rm -f "$file"' EXIT
          if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$file" 2> /dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 im Environment release ist kein gültiges Base64 (unvollständig eingefügt?)."; exit 1
          fi
          alias=$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n\t')
          if ! keytool -list -keystore "$file" -storepass:env KEYSTORE_PASSWORD > /dev/null 2>&1; then
            echo "::error::Der Keystore aus ANDROID_KEYSTORE_BASE64 lässt sich nicht öffnen: Datei beschädigt oder ANDROID_KEYSTORE_PASSWORD falsch."; exit 1
          fi
          if ! cert=$(keytool -exportcert -rfc -keystore "$file" -storepass:env KEYSTORE_PASSWORD -alias "$alias" 2> /dev/null); then
            echo "::error::Im Keystore gibt es keinen Schlüssel mit dem Alias aus ANDROID_KEY_ALIAS."; exit 1
          fi
          if ! have=$(printf '%s\n' "$cert" | openssl x509 -pubkey -noout | grep -v -- '-----' | tr -d '\n'); then
            echo "::error::Das Zertifikat zum Alias aus ANDROID_KEY_ALIAS lässt sich nicht lesen."; exit 1
          fi
          # The private key opens with the same password (publish relies on that).
          if ! keytool -importkeystore -noprompt -srckeystore "$file" -srcstorepass:env KEYSTORE_PASSWORD -srcalias "$alias" \
              -srckeypass:env KEYSTORE_PASSWORD -destkeystore "$RUNNER_TEMP/check.p12" -deststoretype PKCS12 \
              -deststorepass:env KEYSTORE_PASSWORD > /dev/null 2>&1; then
            rm -f "$RUNNER_TEMP/check.p12"
            echo "::error::Der private Schlüssel lässt sich mit ANDROID_KEYSTORE_PASSWORD nicht öffnen (eigenes Key-Passwort?)."; exit 1
          fi
          rm -f "$RUNNER_TEMP/check.p12"
          if [ "$have" != "$PUBKEY" ]; then
            echo "::error::Der Schlüssel im Environment release passt nicht zu GHUL_UPDATE_KEY: falscher Keystore oder Alias."; exit 1
          fi
          echo "Signaturschlüssel in Ordnung."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Rust-Toolchain und NDK
        run: |
          rustup toolchain install  # the version of rust-toolchain.toml
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
      - name: Gradle-Wrapper prüfen (Prüfsumme von services.gradle.org)
        run: echo "$GRADLE_WRAPPER_SHA256  app/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      # The keystore exists only inside this step (not in GITHUB_ENV) and is deleted when it ends.
      - name: Release-APK
        working-directory: app
        env:
          GHUL_VERSION: ${{ needs.plan.outputs.version }}
          GHUL_UPDATE_KEY: ${{ needs.plan.outputs.pubkey }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          file="$RUNNER_TEMP/ghulsuite-release.jks"
          trap 'rm -f "$file"' EXIT
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$file"
          GHUL_KEYSTORE_FILE="$file" GHUL_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" GHUL_KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n\t')" \
            ./gradlew --no-daemon --console=plain :composeApp:assembleRelease
      - name: Bereitstellen
        id: dist
        run: |
          mkdir -p dist
          cp app/composeApp/build/outputs/apk/release/composeApp-release.apk dist/GhulSuite.apk
          echo "apk=$(sha256sum dist/GhulSuite.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-android
          path: dist/
          retention-days: 7

  windows:
    name: Windows (Installer und portable Version)
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      msi: ${{ steps.dist.outputs.msi }}
      zip: ${{ steps.dist.outputs.zip }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle-Wrapper prüfen (Prüfsumme von services.gradle.org)
        shell: bash
        run: echo "$GRADLE_WRAPPER_SHA256  app/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Installer (MSI) und portable Version
        working-directory: app
        shell: bash
        env:
          GHUL_VERSION: ${{ needs.plan.outputs.version }}
          GHUL_UPDATE_KEY: ${{ needs.plan.outputs.pubkey }}
        run: |
          rustup toolchain install  # the version of rust-toolchain.toml
          ./gradlew --no-daemon --console=plain :composeApp:packageMsi :composeApp:createDistributable
      - name: Bereitstellen
        id: dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $msi = Get-ChildItem app/composeApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          Copy-Item $msi.FullName dist/GhulSuite.msi
          $app = "app/composeApp/build/compose/binaries/main/app/GhulSuite"
          Set-Content -Path "$app/portable" -Value "GhulSuite portabel: Daten liegen im Ordner GhulSuite-Daten neben dem Programm."
          Compress-Archive -Path $app -DestinationPath dist/GhulSuite-portable.zip -Force
          "msi=$((Get-FileHash dist/GhulSuite.msi -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_OUTPUT
          "zip=$((Get-FileHash dist/GhulSuite-portable.zip -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: dist/
          retention-days: 7

  publish:
    name: Signieren und veröffentlichen
    needs: [plan, android, windows]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # r9 H1 (supply chain): only the two artifacts of the build jobs, by their exact names (any
      # other job of the run could upload one more "release-..."), and exactly the three files
      # those jobs built (their SHA-256 come as job outputs), before anything is signed.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-android
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-windows
          path: dist/
      - name: Genau die gebauten Dateien
        env:
          APK: ${{ needs.android.outputs.apk }}
          MSI: ${{ needs.windows.outputs.msi }}
          ZIP: ${{ needs.windows.outputs.zip }}
        run: |
          cd dist
          files=$(find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort | tr '\n' ' ')
          if [ "$files" != "GhulSuite-portable.zip GhulSuite.apk GhulSuite.msi " ]; then
            echo "::error::Unerwartete Dateien im Release: $files"; exit 1
          fi
          for h in "$APK" "$MSI" "$ZIP"; do
            printf '%s' "$h" | grep -qE '^[0-9a-f]{64}$' || { echo "::error::Prüfsumme eines Bau-Jobs fehlt."; exit 1; }
          done
          printf '%s  GhulSuite.apk\n%s  GhulSuite.msi\n%s  GhulSuite-portable.zip\n' "$APK" "$MSI" "$ZIP" | sha256sum -c -
      # SHA256SUMS signed with the private key of the signing key (never leaves this job), then
      # checked against the public key the app carries: what the app would accept.
      - name: Prüfsummen signieren
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PUBKEY: ${{ needs.plan.outputs.pubkey }}
        run: |
          cd dist
          # The version is part of what is signed: an old file cannot be offered under a new tag.
          { echo "version ${{ needs.plan.outputs.version }}"; sha256sum GhulSuite.apk GhulSuite.msi GhulSuite-portable.zip; } > SHA256SUMS
          cat SHA256SUMS
          t="$RUNNER_TEMP"
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$t/k.jks"
          keytool -importkeystore -noprompt -srckeystore "$t/k.jks" -srcstorepass:env KEYSTORE_PASSWORD -srcalias "$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n\t')" \
            -srckeypass:env KEYSTORE_PASSWORD -destkeystore "$t/k.p12" -deststoretype PKCS12 -deststorepass:env KEYSTORE_PASSWORD > /dev/null
          openssl pkcs12 -in "$t/k.p12" -nocerts -nodes -passin env:KEYSTORE_PASSWORD -out "$t/key.pem" 2> /dev/null
          openssl dgst -sha256 -sign "$t/key.pem" -out SHA256SUMS.sig SHA256SUMS
          rm -f "$t/k.jks" "$t/k.p12" "$t/key.pem"
          { echo "-----BEGIN PUBLIC KEY-----"; printf '%s\n' "$PUBKEY" | fold -w 64; echo "-----END PUBLIC KEY-----"; } > "$t/pub.pem"
          openssl dgst -sha256 -verify "$t/pub.pem" -signature SHA256SUMS.sig SHA256SUMS
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRE: ${{ needs.plan.outputs.prerelease }}
        run: |
          if [ "$PRE" = true ]; then
            title="GhulSuite $VERSION (Vorabversion)"
            notes="Entwicklungsversion vom Zweig dev ($SHA). Neuer, aber weniger getestet als die stabile Version. In der App: Optionen, Über, Updates, Kanal „Vorab“."
            flags="--prerelease"
          else
            title="GhulSuite $VERSION"
            notes="Stabile Version. Prüfsummen in SHA256SUMS, signiert in SHA256SUMS.sig."
            flags="--latest"
          fi
          # r9 M4: a tag of this name made meanwhile elsewhere would make the release point to
          # other sources (GitHub ignores --target for an existing tag).
          tag=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v$VERSION" -q ".[] | select(.ref == \"refs/tags/v$VERSION\") | .object.sha")
          if [ -n "$tag" ] && [ "$tag" != "$SHA" ]; then
            echo "::error::Der Tag v$VERSION gibt es schon ($tag, nicht $SHA): keine Veröffentlichung."; exit 1
          fi
          # r9 N4: no notes generated from the titles of pull requests (the app shows the notes).
          gh release create "v$VERSION" dist/* --target "$SHA" --title "$title" --notes "$notes" $flags
      # Only the newest five development versions stay (the stable ones all stay).
      - name: Alte Vorabversionen aufräumen
        if: needs.plan.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do
            [ -n "$tag" ] && gh release delete "$tag" --cleanup-tag --yes
          done

  # After a stable release: the download section of the live site shows the new version. Only
  # for main (the environment "website" admits main only); a pre-release of dev skips this.
  website:
    name: Website nach dem Release
    needs: [plan, publish]
    if: needs.plan.outputs.prerelease == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/website.yml
    # inherit: the live job needs WEBSITE_FTP_* from the environment "website".
    secrets: inherit
