# SPDX-License-Identifier: AGPL-3.0-or-later
name: Android & Kern

on:
  push:
    branches: ['**']
    # VERSION, rust-toolchain.toml and release.yml count as a change of the app for the release
    # (its gate), so they start this run, which ends with the release.
    paths: ['core/**', 'app/**', 'docs/testvectors/**', 'tools/**', '.github/workflows/android.yml',
            'VERSION', 'rust-toolchain.toml', '.github/workflows/release.yml',
            '!app/maestro/**', '!tools/ci-emulator.sh', '!tools/run-maestro.sh', '!tools/check-reminders.sh']
  # Every pull request: "build" and "Windows-App (Installer und portable Version)" are required
  # checks. They come from the jobs "build-check" and "windows-check", which always run and report
  # under these names, also when the app and the core did not change.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Only to ask whether a pushed branch has an open pull request (job "changes").
  pull-requests: read

# A newer push cancels the older run, except on main and dev: there the run ends with the release
# (job "release"), which must not stop halfway; a newer run waits for it.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) }}

env:
  # No incremental build data in CI: smaller caches, same result.
  CARGO_INCREMENTAL: "0"
  NDK_VERSION: 28.2.13676358
  CARGO_NDK_VERSION: 4.1.2
  # SHA-256 of app/gradle/wrapper/gradle-wrapper.jar (Gradle 8.14.3, as services.gradle.org lists
  # it): a swapped wrapper would run before distributionSha256Sum is checked. Change both
  # together when Gradle is updated.
  GRADLE_WRAPPER_SHA256: 7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172

jobs:
  testvectors:
    name: Testvektoren unabhängig prüfen (Python)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # r9 H1 (supply chain): every Python package with its version and hash
      # (tools/requirements/*.txt, made with pip-compile --generate-hashes).
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --require-hashes -r tools/requirements/ci-python.txt
          .venv/bin/python tools/verify_testvectors.py
      # Texts: missing translations and differing placeholders fail; terms are listed.
      - name: Texte prüfen (Übersetzungen, Platzhalter, Begriffe)
        run: python3 tools/check-texts.py
      # What other apps can reach and which permissions the app asks for: only as listed.
      - name: Android-Manifest prüfen (von außen erreichbare Komponenten, Berechtigungen)
        run: python3 tools/check-android-manifest.py
      # The texts the emulator flows look for are texts of the app (before the emulator runs).
      - name: Maestro-Abläufe gegen die App-Texte prüfen
        run: .venv/bin/python tools/check-maestro.py

  audit:
    name: Abhängigkeiten auf bekannte Sicherheitslücken prüfen
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Compiled Rust code from earlier runs: only what changed is built again.
      - name: Rust-Zwischenspeicher
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-audit-${{ hashFiles('core/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-audit-${{ hashFiles('core/Cargo.lock') }}-
            ${{ runner.os }}-audit-
      - name: cargo audit (Ausnahmen begründet in docs/AUDIT.md)
        working-directory: core
        run: |
          rustup toolchain install  # the version of rust-toolchain.toml
          command -v cargo-audit > /dev/null || cargo install cargo-audit --locked --quiet
          cargo audit

  # Which parts changed: fuzzing only runs when the core (or its test vectors, or the toolchain)
  # changed; the other jobs only when app, core, tools, VERSION, the toolchain, this workflow or
  # release.yml changed (pull requests run this workflow always): what is released is tested first.
  changes:
    name: Geänderte Bereiche
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.c.outputs.core }}
      code: ${{ steps.c.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: c
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          # A push to a working branch with an open, mergeable pull request: the run of the pull
          # request checks the same commits (and keeps the packages as artifacts), so this run does nothing.
          # Before, every push ran everything twice side by side. main and dev always run on push.
          # When asking fails, or the pull request has conflicts (GitHub then starts no run for
          # it), this run does everything as before.
          if [ "$EVENT" = push ] && [ "$GITHUB_REF_NAME" != main ] && [ "$GITHUB_REF_NAME" != dev ]; then
            pr=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME" -q '.[0].number // empty' 2> /dev/null) || pr=""
            mergeable=""
            if [[ "$pr" =~ ^[1-9][0-9]*$ ]]; then
              mergeable=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" -q '.mergeable' 2> /dev/null) || mergeable=""
            fi
            if [ "$mergeable" = true ]; then
              echo "Offener Pull Request #$pr für $GITHUB_REF_NAME: dessen Lauf prüft, dieser Lauf entfällt."
              echo "core=false" >> "$GITHUB_OUTPUT"; echo "code=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2> /dev/null; then
            echo "core=true" >> "$GITHUB_OUTPUT"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # r9 M2: a push to main or dev runs everything (it ends with the release, which
          # compares with the last release, not with the push before: fuzzing and the stress
          # test must not be skipped for a core that changed earlier).
          if [ "$EVENT" = push ] && { [ "$GITHUB_REF_NAME" = main ] || [ "$GITHUB_REF_NAME" = dev ]; }; then
            echo "core=true" >> "$GITHUB_OUTPUT"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          if printf '%s\n' "$files" | grep -qE '^(core/|docs/testvectors/|rust-toolchain\.toml$)'; then core=true; else core=false; fi
          if printf '%s\n' "$files" | grep -qE '^(core/|app/|docs/testvectors/|tools/|\.github/workflows/(android|release)\.yml|VERSION$|rust-toolchain\.toml$)'; then code=true; else code=false; fi
          echo "Kern geändert: $core · App/Kern/Werkzeuge geändert: $code"
          echo "core=$core" >> "$GITHUB_OUTPUT"; echo "code=$code" >> "$GITHUB_OUTPUT"

  # The signing key and the credentials of the live website belong in environments ("signing",
  # "release", "website"), not on the repository level: there any job of any branch reads them.
  # This job has no environment, so it sees only repository secrets. A warning on working
  # branches and pull requests (the pull request that brings the environments must still merge),
  # an error on a push to main or dev. Only the required checks (and so the release) wait for
  # it: tests and artifacts run all the same.
  secrets-check:
    name: Keine Signatur- oder Website-Secrets auf Repository-Ebene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          S1: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          S2: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          S3: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          S4: ${{ secrets.WEBSITE_FTP_SERVER != '' }}
          S5: ${{ secrets.WEBSITE_FTP_USER != '' }}
          S6: ${{ secrets.WEBSITE_FTP_PASSWORD != '' }}
          PROTECTED: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
        run: |
          left=""
          [ "$S1" = true ] && left="$left ANDROID_KEYSTORE_BASE64"
          [ "$S2" = true ] && left="$left ANDROID_KEYSTORE_PASSWORD"
          [ "$S3" = true ] && left="$left ANDROID_KEY_ALIAS"
          [ "$S4" = true ] && left="$left WEBSITE_FTP_SERVER"
          [ "$S5" = true ] && left="$left WEBSITE_FTP_USER"
          [ "$S6" = true ] && left="$left WEBSITE_FTP_PASSWORD"
          [ -z "$left" ] && exit 0
          msg="Secrets auf Repository-Ebene:$left. Sie gehören in die Environments (signing/release bzw. website) und sind auf Repository-Ebene zu löschen."
          if [ "$PROTECTED" = true ]; then echo "::error::$msg"; exit 1; fi
          echo "::warning::$msg"

  fuzz:
    name: Fuzzing (je 2 Minuten)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Compiled Rust code from earlier runs: only what changed is built again.
      - name: Rust-Zwischenspeicher
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/fuzz/target/
          key: ${{ runner.os }}-fuzz-${{ hashFiles('core/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-fuzz-${{ hashFiles('core/Cargo.lock') }}-
            ${{ runner.os }}-fuzz-
      - name: Nightly und cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          command -v cargo-fuzz > /dev/null || cargo install cargo-fuzz --locked
      - name: Fuzzing
        working-directory: core/fuzz
        run: |
          mkdir -p corpus/container_parse
          python3 - <<'PY'
          import json
          d = json.load(open('../../docs/testvectors/container-v3.json'))
          for i, v in enumerate(d['vectors']):
              open(f'corpus/container_parse/vector{i}', 'wb').write(bytes.fromhex(v['file']))
          PY
          cargo +nightly fuzz run container_parse corpus/container_parse -- -max_total_time=120 -rss_limit_mb=3000
          cargo +nightly fuzz run ctap_responses -- -max_total_time=120
          cargo +nightly fuzz run docs_files -- -max_total_time=120 -rss_limit_mb=3000
      - name: Fundstücke sichern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: core/fuzz/artifacts/

  stress:
    name: Alltags- und Stresstest (Release)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust-Zwischenspeicher
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-stress-${{ hashFiles('core/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-stress-${{ hashFiles('core/Cargo.lock') }}-
            ${{ runner.os }}-stress-
      # Thousands of entries and appointments, many saves and parallel threads; the
      # log lists the time of every step.
      - name: Alltagstest und Stresstests
        working-directory: core
        run: |
          rustup toolchain install  # the version of rust-toolchain.toml
          cargo test --locked --release -p ghul-core --lib everyday -- --include-ignored --nocapture --test-threads=1

  windows:
    # The required check "Windows-App (Installer und portable Version)" is the job
    # "windows-check" below, not this one.
    name: Windows-App bauen
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Compiled Rust code from earlier runs: only what changed is built again.
      - name: Rust-Zwischenspeicher
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
            app/composeApp/build/rust/
          key: ${{ runner.os }}-windows-${{ hashFiles('core/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-windows-${{ hashFiles('core/Cargo.lock') }}-
            ${{ runner.os }}-windows-

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/**/*.gradle.kts
            app/gradle/libs.versions.toml
            app/gradle/wrapper/gradle-wrapper.properties

      - name: Rust-Kern unter Windows prüfen (Clippy, Tests)
        working-directory: core
        shell: bash
        # All checks run, also after a failing one: one run shows every error (tools/precheck.sh
        # finds most of them before a push).
        run: |
          rustup toolchain install  # the version of rust-toolchain.toml
          rc=0
          cargo clippy --locked -p ghul-core --all-targets -- -D warnings || { echo "::error::Clippy (Windows)"; rc=1; }
          cargo test --locked --no-fail-fast -p ghul-core || { echo "::error::Tests (Windows)"; rc=1; }
          exit $rc

      # Gradle runs only with the checked wrapper (also when an earlier check failed: then the
      # wrapper step must have passed all the same).
      - name: Gradle-Wrapper prüfen (Prüfsumme von services.gradle.org)
        id: wrapper
        if: ${{ !cancelled() }}
        shell: bash
        run: echo "$GRADLE_WRAPPER_SHA256  app/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: FFI-Tests, Installer (MSI) und portable Version
        if: ${{ !cancelled() && steps.wrapper.outcome == 'success' }}
        working-directory: app
        shell: bash
        run: ./gradlew --no-daemon --console=plain --continue :composeApp:desktopTest :composeApp:packageMsi :composeApp:createDistributable

      - name: Pakete bereitstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $msi = Get-ChildItem app/composeApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          Copy-Item $msi.FullName dist/ghulsuite-dev.msi
          # Portable: the marker file "portable" keeps all data next to the program (e.g. on a USB stick).
          $app = "app/composeApp/build/compose/binaries/main/app/GhulSuite"
          Set-Content -Path "$app/portable" -Value "GhulSuite portabel: Daten liegen im Ordner GhulSuite-Daten neben dem Programm."
          Compress-Archive -Path $app -DestinationPath dist/ghulsuite-dev-portable.zip -Force
          Get-ChildItem dist | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii -FilePath "dist/$($_.Name).sha256"
          }
          Get-ChildItem dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghulsuite-windows-dev
          path: dist/
          retention-days: 30

  build:
    # The required check "build" is the job "build-check" below, not this one.
    name: Android-App bauen und testen
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Only a push to main or dev runs in the environment "signing" (it holds the real signing
    # key; deployment branches main and dev, no approval, so every CI run goes on by itself).
    # Every other run uses the environment "ci", which has no secrets: never an empty name.
    environment: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) && 'signing' || 'ci' }}
    permissions:
      contents: read
      # For the screenshot comparison: the artifacts of the last run of dev.
      actions: read
    # From scratch on main and dev (no cache, see SIGNING): more time.
    timeout-minutes: 60
    env:
      # r9 M1: the run that gets the real signing key restores no cache (a cache entry written
      # by any job of the branch could bring a changed cargo-ndk or Gradle file into the step
      # with the key). It builds from scratch and saves its result for the other runs.
      SIGNING: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Compiled Rust code from earlier runs: only what changed is built again.
      - name: Rust-Zwischenspeicher
        if: env.SIGNING != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
            app/composeApp/build/rust/
          key: ${{ runner.os }}-build-${{ hashFiles('core/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('core/Cargo.lock') }}-
            ${{ runner.os }}-build-

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: ${{ env.SIGNING != 'true' && 'gradle' || '' }}
          cache-dependency-path: |
            app/**/*.gradle.kts
            app/gradle/libs.versions.toml
            app/gradle/wrapper/gradle-wrapper.properties

      - name: Rust-Toolchain
        run: |
          rustup toolchain install  # the version of rust-toolchain.toml
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo ndk --version 2> /dev/null | grep -q "$CARGO_NDK_VERSION" || cargo install cargo-ndk --locked --force --version "$CARGO_NDK_VERSION"

      - name: Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: Rust-Kern prüfen (Format, Clippy, Tests inkl. simuliertem Key und Testvektoren)
        working-directory: core
        # All checks run, also after a failing one: one run shows every error.
        run: |
          rustup component add rustfmt clippy
          rc=0
          cargo fmt --all -- --check || { echo "::error::Formatierung (cargo fmt)"; rc=1; }
          cargo clippy --locked -p ghul-core --all-targets --features mock -- -D warnings || { echo "::error::Clippy"; rc=1; }
          cargo test --locked --no-fail-fast -p ghul-core || { echo "::error::Tests"; rc=1; }
          exit $rc

      # The real signing key only reaches this job for a push to main or dev (environment
      # "signing", whose secrets and deployment branches the owner limits to main and dev). Every
      # other run (working branches, pull requests, manual starts, forks) signs with a throwaway
      # key generated here: such an APK (applicationIdSuffix ".dev") cannot replace the real app.
      # Keystore file and password exist only inside the Gradle step (not in GITHUB_ENV, so no
      # later step sees them) and the file is deleted when it ends. Also runs when the Rust checks
      # above failed, so their errors and the app's come in one run.
      - name: Gradle-Wrapper prüfen (Prüfsumme von services.gradle.org)
        id: wrapper
        if: ${{ !cancelled() }}
        run: echo "$GRADLE_WRAPPER_SHA256  app/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: FFI-Tests und APK
        if: ${{ !cancelled() && steps.wrapper.outcome == 'success' }}
        working-directory: app
        env:
          SIGN_REAL: ${{ github.repository_owner == 'ghulaschsuppe' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
          KEYSTORE_B64: ${{ (github.repository_owner == 'ghulaschsuppe' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ (github.repository_owner == 'ghulaschsuppe' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ (github.repository_owner == 'ghulaschsuppe' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) && secrets.ANDROID_KEY_ALIAS || '' }}
        run: |
          file="$RUNNER_TEMP/ghulsuite-signing.jks"
          trap 'rm -f "$file"' EXIT
          if [ "$SIGN_REAL" = true ] && [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$file"
            export GHUL_KEYSTORE_FILE="$file" GHUL_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" GHUL_KEY_ALIAS="$KEY_ALIAS"
          else
            [ "$SIGN_REAL" = true ] && echo "::warning::Secret ANDROID_KEYSTORE_BASE64 fehlt, APK wird nur mit einem Wegwerf-Schlüssel signiert."
            # The throwaway key: same build as with the real key (not debuggable, so the emulator
            # tests behave the same), only the signature differs.
            pass=$(openssl rand -hex 24)
            echo "::add-mask::$pass"
            keytool -genkeypair -keystore "$file" -storepass "$pass" -keypass "$pass" -alias ghulsuite \
              -keyalg RSA -keysize 2048 -validity 30 -dname "CN=GhulSuite throwaway CI key" -noprompt > /dev/null
            export GHUL_KEYSTORE_FILE="$file" GHUL_KEYSTORE_PASSWORD="$pass" GHUL_KEY_ALIAS=ghulsuite
          fi
          echo "$GRADLE_WRAPPER_SHA256  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c - || exit 1
          ./gradlew --no-daemon --console=plain --continue :composeApp:desktopTest :composeApp:assembleDebug

      # Built from scratch on main and dev: saved for the runs of working branches and pull
      # requests (they restore it; this run never does).
      - name: Rust-Zwischenspeicher sichern
        if: ${{ !cancelled() && env.SIGNING == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
            app/composeApp/build/rust/
          key: ${{ runner.os }}-build-${{ hashFiles('core/Cargo.lock') }}-${{ github.sha }}

      - name: APK bereitstellen
        run: |
          mkdir -p dist
          cp app/composeApp/build/outputs/apk/debug/composeApp-debug.apk dist/ghulsuite-dev.apk
          (cd dist && sha256sum ghulsuite-dev.apk | tee ghulsuite-dev.apk.sha256)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghulsuite-dev
          path: dist/
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: app/composeApp/build/screenshots/
          retention-days: 30

      # Every screen against the last green run of dev: a page with only what changed (before,
      # after, changed pixels in red), to look at each change on purpose. Never fails the run.
      # Only in pull request runs, which never hold the real signing key; pillow is pinned.
      - name: Bildvergleich mit dev
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" -w android.yml -e push -b dev -s success -L 1 --json databaseId -q '.[0].databaseId')
          [ -n "$id" ] || { echo "Kein grüner Lauf auf dev zum Vergleichen."; exit 0; }
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n screenshots -D "$RUNNER_TEMP/before"
          pip install --quiet --require-hashes -r tools/requirements/ci-pillow.txt
          python3 tools/compare-screenshots.py "$RUNNER_TEMP/before" app/composeApp/build/screenshots "$RUNNER_TEMP/screenshot-diff" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          name: screenshot-diff
          path: ${{ runner.temp }}/screenshot-diff/
          retention-days: 30
          if-no-files-found: ignore

  # The Android app in the emulator for every pull request and for main, with the APK of this
  # run and a screenshot after every step (emulator.yml). Monkey and the intent attacks run in the
  # nightly run; emulator.yml can also be started by hand for any branch.
  emulator:
    name: Emulator-Tests
    needs: build
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/emulator.yml
    with:
      same-run: true

  # The required checks. GitHub does not work out the name of a skipped job (it shows the raw
  # expression), so the jobs that may be skipped have fixed names and these two always run.
  # In the push run of a working branch they report under another name: the required checks of a
  # pull request come only from its own run, never from a push run that skipped itself on the
  # same commit. Passed means: the job ran successfully, or it was skipped (nothing it checks
  # changed, or a push run next to an open pull request).
  build-check:
    name: ${{ (github.event_name == 'push' && github.ref_name != 'main' && github.ref_name != 'dev') && 'build (Push)' || 'build' }}
    needs: [changes, build, secrets-check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.build.result }}
          SECRETS: ${{ needs.secrets-check.result }}
        run: |
          echo "Geänderte Bereiche: $CHANGES · Android-App bauen und testen: $RESULT"
          [ "$SECRETS" = success ] || echo "::error::Secrets auf Repository-Ebene (siehe Job secrets-check)."
          [ "$SECRETS" = success ] && [ "$CHANGES" = success ] && { [ "$RESULT" = success ] || [ "$RESULT" = skipped ]; }

  windows-check:
    name: ${{ (github.event_name == 'push' && github.ref_name != 'main' && github.ref_name != 'dev') && 'Windows-App (Push)' || 'Windows-App (Installer und portable Version)' }}
    needs: [changes, windows, secrets-check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.windows.result }}
          SECRETS: ${{ needs.secrets-check.result }}
        run: |
          echo "Geänderte Bereiche: $CHANGES · Windows-App bauen: $RESULT"
          [ "$SECRETS" = success ] || echo "::error::Secrets auf Repository-Ebene (siehe Job secrets-check)."
          [ "$SECRETS" = success ] && [ "$CHANGES" = success ] && { [ "$RESULT" = success ] || [ "$RESULT" = skipped ]; }

  # The release (release.yml), as the last job of this run: only for a push to main or dev, and
  # only when the required checks passed and no other job failed or was cancelled (skipped jobs,
  # e.g. the emulator on dev, are fine). Whether the app changed since the last release, and so
  # whether there is a new version at all, release.yml decides by itself. The signing key comes
  # from the environment "release" inside the called jobs; only the legal notice of the website
  # (repository secrets) is passed on.
  release:
    name: Veröffentlichen
    needs: [testvectors, audit, changes, secrets-check, fuzz, stress, windows, build, emulator, build-check, windows-check]
    if: >-
      ${{ !cancelled() && github.repository_owner == 'ghulaschsuppe' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      needs.secrets-check.result == 'success' && needs.build-check.result == 'success' &&
      needs.windows-check.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets:
      IMPRESSUM_NAME: ${{ secrets.IMPRESSUM_NAME }}
      IMPRESSUM_ADRESSE: ${{ secrets.IMPRESSUM_ADRESSE }}
      IMPRESSUM_EMAIL: ${{ secrets.IMPRESSUM_EMAIL }}
      IMPRESSUM_HOSTER: ${{ secrets.IMPRESSUM_HOSTER }}
