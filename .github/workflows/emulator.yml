# SPDX-License-Identifier: AGPL-3.0-or-later
# The Android app in the emulator (Maestro flows, app/maestro), in three parts side by side, each
# on its own emulator (tools/run-maestro.sh, MAESTRO_SHARD):
#   base    setup, GhulPass, GhulAuth, GhulCal, app PIN, options, areas with an unreachable server
#   server  with a real SFTP server: GhulDrive, servers, synchronisation, sharing
#   mail    with real IMAP/SMTP servers: a mail account, a mail to oneself, reading it
# The servers answer slowly on purpose (150 ms each way, 2 % of the packets lost), as on a phone
# outside the home network: that is where waiting, cancelled loads and taps in between show their
# mistakes. The server part also cuts the servers off for a while (tools/slow-servers.sh).
# Every step leaves a screenshot (artifact emulator-<part>).
#
# Called by android.yml for every pull request and for main (APK of the same run), by nightly.yml,
# and by hand for any branch ("Run workflow", APK of the latest "Android & Kern" run of the branch).
name: Emulator-Tests

on:
  workflow_dispatch:
    inputs:
      servers:
        description: Auch die Abläufe mit echten Testservern (SFTP, IMAP, SMTP)
        type: boolean
        default: true
  workflow_call:
    inputs:
      servers:
        type: boolean
        default: true
      same-run:
        description: The APK comes from the calling run (artifact ghulsuite-dev).
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  emulator:
    name: Emulator (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        part: [base, server, mail]
    env:
      MAESTRO_VERSION: cli-2.12.1
      MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
      MAESTRO_SHARD: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: APK aus diesem Lauf
        if: inputs.same-run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ghulsuite-dev
          path: dist/
      - name: APK des letzten Laufs dieses Branches holen
        if: ${{ !inputs.same-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest APK of this branch; a new branch without its own build yet uses the one of main.
          for branch in "$GITHUB_REF_NAME" main; do
            for id in $(gh run list -R "$GITHUB_REPOSITORY" -w android.yml -b "$branch" -L 15 --json databaseId -q '.[].databaseId'); do
              if gh run download "$id" -R "$GITHUB_REPOSITORY" -n ghulsuite-dev -D dist 2> /dev/null; then echo "APK aus Lauf $id ($branch)"; break 2; fi
            done
          done
          test -f dist/ghulsuite-dev.apk
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: KVM für den Emulator freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Maestro (feste Version, Prüfsumme geprüft)
        run: |
          curl -fsSL -o /tmp/maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  /tmp/maestro.zip" | sha256sum -c -
          unzip -q /tmp/maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      - name: Testserver (SFTP mit Passwort, IMAP, SMTP), langsam wie ein Mobilnetz
        if: inputs.servers && matrix.part != 'base'
        timeout-minutes: 12
        run: |
          # tools/run-maestro.sh forwards these ports to the emulator (adb reverse).
          ok=0
          for i in 1 2 3; do
            timeout 120 sudo apt-get update -qq || true
            if timeout 240 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Acquire::Retries=3 openssh-server dovecot-imapd > /dev/null; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "::error::Paketserver nicht erreichbar, die Testserver fehlen."; exit 1; }
          sudo env GHUL_TEST_SFTP_PASSWORD=1 bash tools/test-servers.sh > servers.env
          echo "GHUL_TEST_SERVERS=1" >> "$GITHUB_ENV"
          sudo bash tools/slow-servers.sh 150 2
      - name: Abläufe im Emulator (Android 14, Teil ${{ matrix.part }})
        env:
          # After the flows of the server part: a short monkey (random taps and swipes) with the
          # real, slow servers; a new seed each run, named in the log to repeat it.
          MONKEY_EVENTS: ${{ matrix.part == 'server' && '3000' || '0' }}
          MONKEY_SEEDS: ${{ github.run_number }}
        run: |
          if [ "$MAESTRO_SHARD" != base ] && [ "${GHUL_TEST_SERVERS:-0}" != 1 ]; then
            echo "Ohne Testserver: Teil $MAESTRO_SHARD entfällt."; exit 0
          fi
          mkdir -p maestro-out
          tools/ci-emulator.sh dist/ghulsuite-dev.apk maestro-out
      - name: Logs der Testserver zu den Ergebnissen legen
        if: always()
        run: |
          # Only the logs of the throwaway test servers (no keys); they show why a login failed.
          if [ -f servers.env ]; then
            . ./servers.env
            mkdir -p maestro-out/servers
            for f in dovecot/dovecot.log smtp.log; do
              sudo cp "$GHUL_TEST_DIR/$f" maestro-out/servers/ 2>/dev/null || true
            done
            sudo chown -R "$(id -u)" maestro-out/servers
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: emulator-${{ matrix.part }}
          path: maestro-out/
          retention-days: 30
