# SPDX-License-Identifier: AGPL-3.0-or-later
# Fast run of the emulator tests alone when only the flows change: takes the APK of the latest
# "Android & Kern" run of this branch instead of building it again (that workflow runs them too).
name: Emulator-Tests

on:
  push:
    branches: ['**']
    paths: ['app/maestro/**', 'tools/ci-emulator.sh', 'tools/run-maestro.sh', 'tools/check-reminders.sh', '.github/workflows/emulator.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # When the same push also changes the app, the core or the tools, "Android & Kern" builds a fresh
  # APK and runs these flows itself. Running them here against the previous APK would test new
  # flows with an old app and fail for no reason.
  changes:
    name: Nur Abläufe geändert?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      only_flows: ${{ steps.c.outputs.only_flows }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: c
        env:
          BASE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != push ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2> /dev/null; then
            echo "only_flows=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Same paths as the push trigger of android.yml (without the flows themselves).
          if git diff --name-only "$BASE" HEAD | grep -vE '^(app/maestro/|tools/ci-emulator\.sh|tools/run-maestro\.sh|tools/check-reminders\.sh)' \
              | grep -qE '^(core/|app/|docs/testvectors/|tools/|\.github/workflows/android\.yml|\.github/actions/ftps-upload/)'; then
            echo "App oder Kern geändert: die Abläufe laufen in \"Android & Kern\" mit der neuen APK."
            echo "only_flows=false" >> "$GITHUB_OUTPUT"
          else
            echo "only_flows=true" >> "$GITHUB_OUTPUT"
          fi

  emulator:
    name: Maestro-Abläufe im Android-Emulator
    needs: changes
    if: needs.changes.outputs.only_flows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      MAESTRO_VERSION: cli-2.12.1
      MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: APK des letzten Laufs dieses Branches holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest APK of this branch; a new branch without its own build yet uses the one of main.
          for branch in "$GITHUB_REF_NAME" main; do
            for id in $(gh run list -R "$GITHUB_REPOSITORY" -w android.yml -b "$branch" -L 15 --json databaseId -q '.[].databaseId'); do
              if gh run download "$id" -R "$GITHUB_REPOSITORY" -n ghulsuite-dev -D dist 2> /dev/null; then echo "APK aus Lauf $id ($branch)"; break 2; fi
            done
          done
          test -f dist/ghulsuite-dev.apk
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: KVM für den Emulator freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Maestro (feste Version, Prüfsumme geprüft)
        run: |
          curl -fsSL -o /tmp/maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  /tmp/maestro.zip" | sha256sum -c -
          unzip -q /tmp/maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      - name: Testserver für die Abläufe mit echtem Server (SFTP mit Passwort, IMAP, SMTP)
        timeout-minutes: 12
        run: |
          # The emulator reaches these servers of the runner as 10.0.2.2. If the package mirror
          # is down, the flows with a real server are skipped with a warning.
          ok=0
          for i in 1 2 3; do
            timeout 120 sudo apt-get update -qq || true
            if timeout 240 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Acquire::Retries=3 openssh-server dovecot-imapd > /dev/null; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" = 1 ]; then
            sudo env GHUL_TEST_SFTP_PASSWORD=1 bash tools/test-servers.sh > servers.env
            echo "GHUL_TEST_SERVERS=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Paketserver nicht erreichbar: Abläufe mit echtem Server übersprungen."
          fi
      - name: Abläufe im Emulator (Android 14)
        run: |
          mkdir -p maestro-out
          tools/ci-emulator.sh dist/ghulsuite-dev.apk maestro-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: emulator-tests
          path: maestro-out/
          retention-days: 30
