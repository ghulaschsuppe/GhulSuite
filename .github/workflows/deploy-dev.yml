name: Deploy dev

on:
  push:
    branches: ['**']
    paths: ['public/**', '.github/workflows/deploy-dev.yml', '.github/actions/ftps-upload/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    # Only in the original repository (forks have no access to the test server).
    if: github.repository_owner == 'ghulaschsuppe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Zielordner auf dem Testserver
        id: dest
        shell: bash
        run: |
          # main -> ghulsuite/, every other branch -> ghulsuite/branches/<branch>/
          if [ "$GITHUB_REF_NAME" = "main" ]; then dir=ghulsuite; else
            b=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-'); dir="ghulsuite/branches/$b"; fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Upload auf den eigenen Testserver (Ordner ghulsuite bzw. Branch-Ordner)
        uses: ./.github/actions/ftps-upload
        with:
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          remote-dir: ${{ steps.dest.outputs.dir }}/
