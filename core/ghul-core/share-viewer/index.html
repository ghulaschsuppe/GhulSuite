<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>GhulSuite: geteilte Datei</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<main class="box">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8.2-8 9-4.8-.8-8-4.5-8-9V6z"/></svg></div>
  <h1 id="title">Geteilte Datei</h1>
  <p id="msg" class="muted">Wird geladen …</p>
  <div id="file" hidden>
    <p class="name" id="name"></p>
    <p class="muted" id="size"></p>
  </div>
  <form id="pwform" hidden>
    <label for="pw" id="pwlabel">Passwort</label>
    <input id="pw" type="password" autocomplete="off" required>
    <button type="submit" id="pwbtn">Öffnen</button>
  </form>
  <ul class="files" id="files" hidden></ul>
  <button id="all" hidden>Alle herunterladen</button>
  <p class="hint" id="hint" hidden></p>
  <p class="note" id="note">Ende-zu-Ende verschlüsselt. Der Schlüssel steht nur im Link und wird nie an den Server geschickt.</p>
</main>
<script src="viewer.js"></script>
</body>
</html>
