[package]
name = "ghul-core"
description = "GhulSuite core: cryptography, container formats and FIDO2 (CTAP2) client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "ghul_core"

[features]
# Entry points for the long fuzzing runs in core/fuzz (no effect on the app).
fuzzing = []
# Exposes a software authenticator for FFI tests on the host. Never enabled in app builds.
mock = []

[dependencies]
uniffi = "=0.29.4"
thiserror = "2"
ciborium = "0.2.2"
p256 = { version = "0.14", features = ["ecdh"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
argon2 = { version = "0.5", features = ["zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
chacha20poly1305 = "0.10"
# Public-key slots (FORMAT.md, section 4.2): the app can wrap a new factor secret for every key
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha1 = "0.10"
base64 = "0.22"
zxcvbn = { version = "3.1", default-features = false }
serde_json = "1"
# M43: only "deflate": the import reads plain ZIP exports (1Password, Proton Pass); an encrypted
# entry is refused as ImportEncrypted. No AES of the ZIP format (it pulled in pbkdf2 and more).
zip = { version = "9", default-features = false, features = ["deflate"] }
# CRC-32 of the entries of a suite file (written and read as a stream, app/zipstream.rs)
crc32fast = "1"
# Network (update check, password leak check): pure Rust with ring, no OpenSSL/C dependencies
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Signature check of app updates (the same ring as TLS)
ring = "0.17"
webpki-roots = "1"

[dev-dependencies]
rand_chacha = "0.3"

[target.'cfg(unix)'.dependencies]
# H12: free space of the device before content is staged (statvfs; already in the tree via tokio).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Security keys through the system's WebAuthn API (webauthn.dll): see src/key_device.rs.
# Win32_Storage_FileSystem: free space before content is staged (GetDiskFreeSpaceExW, H12).
# Win32_System_Threading: whether the process of a staging folder still runs (OpenProcess).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WindowsWebServices", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
