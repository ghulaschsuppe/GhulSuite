[workspace]
resolver = "2"
members = ["ghul-core", "uniffi-bindgen"]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
version = "0.5.0"
rust-version = "1.80"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Argon2 is unusably slow without optimizations; keep tests fast with realistic parameters.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
